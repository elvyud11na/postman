name: API Tests

on: [push]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g newman newman-reporter-allure allure-commandline
      - run: newman run tests/collection.json -e tests/environment.json --reporters cli,junit,allure --reporter-junit-export newman-report.xml
        continue-on-error: true
      - run: allure generate allure-results -o allure-report --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report